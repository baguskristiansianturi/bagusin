server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|xml|txt)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }
}
