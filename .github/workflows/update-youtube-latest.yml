name: Update latest YouTube video

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp

      - name: Read latest public video
        shell: bash
        run: |
          yt-dlp             --flat-playlist             --playlist-end 1             --dump-single-json             "https://www.youtube.com/@BagusInOfficial/videos"             > /tmp/latest.json

      - name: Write website data
        shell: python
        run: |
          import json
          from pathlib import Path

          raw = json.loads(Path("/tmp/latest.json").read_text())
          entries = raw.get("entries") or []
          video = entries[0] if entries else None

          payload = {
              "channel": {
                  "name": "BagusIn",
                  "url": "https://www.youtube.com/@BagusInOfficial"
              },
              "video": None,
              "updatedAt": None
          }

          if video and video.get("id"):
              video_id = video["id"]
              payload["video"] = {
                  "id": video_id,
                  "title": video.get("title") or "Latest video",
                  "description": "",
                  "thumbnail": f"https://i.ytimg.com/vi/{video_id}/maxresdefault.jpg",
                  "url": f"https://www.youtube.com/watch?v={video_id}",
                  "publishedAt": video.get("upload_date") and (
                      video["upload_date"][:4] + "-" +
                      video["upload_date"][4:6] + "-" +
                      video["upload_date"][6:8]
                  )
              }
              payload["updatedAt"] = __import__("datetime").datetime.utcnow().isoformat() + "Z"

          Path("data/youtube-latest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh latest YouTube video"
          git push
