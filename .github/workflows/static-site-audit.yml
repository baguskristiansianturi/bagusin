name: Static site audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Check routes and SEO metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static site audit
        run: node scripts/audit-static-site.mjs
  browser-smoke:
    name: Responsive browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Initialize temporary package metadata
        run: npm init -y
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the site and run responsive browser smoke tests
        run: |
          mkdir -p /tmp/bagusin-site/bagusin
          rsync -a --exclude='.git' --exclude='node_modules' ./ /tmp/bagusin-site/bagusin/
          python3 -m http.server 4173 --directory /tmp/bagusin-site >/tmp/bagusin-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/bagusin/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/responsive-smoke.mjs
